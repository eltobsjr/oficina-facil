<!-- @dsCard group="Ações" height=170 subtitle="Pílula de ação e botões utilitários" -->
<style>
  body{margin:0;padding:20px;background:var(--canvas-parchment);font-family:var(--font-sans);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .b{border:0;font:400 17px/1 var(--font-sans);letter-spacing:-0.374px;cursor:default}
  .p{background:var(--primary);color:var(--on-primary);border-radius:var(--radius-pill);padding:11px 22px}
  .s{background:transparent;color:var(--primary);border:1px solid var(--primary);border-radius:var(--radius-pill);padding:10px 22px}
  .u{background:var(--ink);color:var(--body-on-dark);border-radius:var(--radius-sm);padding:8px 15px;font-size:14px;letter-spacing:-0.224px}
  .c{background:var(--surface-pearl);color:var(--ink-muted-80);border:3px solid var(--divider-soft);border-radius:var(--radius-md);padding:8px 14px;font-size:14px}
  .d{background:var(--canvas-parchment);color:var(--ink-muted-48);border:1px solid var(--hairline);border-radius:var(--radius-pill);padding:10px 22px}
  .x{background:transparent;color:var(--danger);border:1px solid var(--danger);border-radius:var(--radius-pill);padding:10px 22px}
  .a{transform:scale(.95)}
</style>
<button class="b p">Abrir OS</button>
<button class="b p a">Pressionado</button>
<button class="b s">Ver detalhes</button>
<button class="b u">Sair</button>
<button class="b c">Editar</button>
<button class="b x">Cancelar OS</button>
<button class="b d" disabled>Entregar veículo</button>
